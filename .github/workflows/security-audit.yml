name: Security Audit

# Weekly npm audit against the lockfile. Dependabot remains the primary
# alert source; this catches advisories between Dependabot runs without
# costing anything per PR.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Only what ships in the image can fail the job. Dev tooling (nodemon,
      # stylelint) pulls in packages that sometimes have no patched release
      # at all (e.g. braces, GHSA-vfj7-8cjw-p6xm), which would keep the job
      # red with nothing to act on.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Audit dev dependencies (report only)
        run: |
          if ! npm audit --audit-level=moderate; then
            echo "::warning title=npm audit::Dev dependencies have open advisories - see the log above"
          fi
